<!--
Front-page snippet for bitba.ng. The server splices this file into
bootstrap.html (at the FRONT_PAGE marker) when serving `/`. The
div#bb-pair-input below is where bootstrap.js renders the pair-code
form. See FRONT_PAGE_PATH docs in cmd/signaling/main.go for the full
contract. bitba.ng-specific — self-hosted deployments ship their own.
-->
<style>
  .bb-page {
    max-width: 520px;
    margin: 20px auto;
    padding: 0 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #333;
  }
  .bb-page p { font-size: 14px; line-height: 1.5; color: #555; margin: 8px 0; }
  /* Override the 48px default that .pair-box (applied by bootstrap.js)
     would otherwise contribute — we want a tighter entry-page top. */
  .bb-page #bb-pair-input.pair-box { margin-top: 29px; }
  .bb-page .bb-install-section { margin-top: 16px; }
  .bb-page .bb-install {
    background: #f4f4f4;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 12px 14px;
    font-family: "SF Mono", Menlo, Monaco, Consolas, monospace;
    font-size: 13px;
    color: #111;
    margin: 16px 0;
    user-select: all;
    overflow-x: auto;
  }
  .bb-page .bb-links { font-size: 13px; color: #888; margin-top: 16px; }
  .bb-page .bb-links a { color: #06c; text-decoration: none; }
  .bb-page .bb-links a:hover { text-decoration: underline; }
  .bb-page .bb-install-section a { color: #06c; text-decoration: none; }
  .bb-page .bb-install-section a:hover { text-decoration: underline; }
</style>
<div class="bb-page">
  <div id="bb-pair-input"></div>

  <div class="bb-install-section">
    <p>Install the CLI automatically by running the command below or <a href="https://github.com/richlegrand/bitbang-cli/releases" target="_blank" rel="noopener">download</a>.</p>
    <div class="bb-install">curl -sSfL bitba.ng/install | sh</div>
  </div>

  <p class="bb-links">
    <a href="https://github.com/richlegrand/bitbang" target="_blank" rel="noopener">Learn more about BitBang</a>
    &nbsp;·&nbsp;
    <a href="https://github.com/richlegrand/bitbang-cli" target="_blank" rel="noopener">BitBang CLI repo</a>
  </p>
</div>
