<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Settings</title>
<!--
  The settings plugin's (internal/plugins/settings), served at
  /__bitbang__/settings.html like any meta-page.

  The device settings meta-page, which is now a wrapper. Everything that draws
  anything lives in settings-panel.js and mounts into a shadow root, so the same
  implementation serves this page and a panel embedded in a sketch's own layout
  through data-bitbang-page="settings". See that file for why a shadow root
  rather than an iframe or a plain div.

  Renders whatever the device declares and knows nothing about any key. Adding a
  setting to a device needs no change here; see device-settings.md.

  To iterate on it, flash the settings_demo example. It is a device whose table
  declares every element of the vocabulary at once, so a rendering defect appears
  beside the cases that render correctly, and it is the only device covering
  secret, confirm, reboot, the radio hint, a readonly bool, an int with no range,
  a live value, the section headings and both polarities of a refine hook.

  That replaced a Python script that used to sit here answering
  /__bitbang/settings by hand. It was a second implementation of this protocol
  that nobody flashed, so it drifted until it declared settings the firmware had
  renamed and tabs it no longer had. A declaration comes from a device.

  ?src=<url> still reads a declaration from somewhere else -- a response saved
  off a real device, say -- and needs nothing on this end to exist.
-->
<style>
  /* The page's own frame. Everything inside the panel is the component's, and
     these two rules are the only things left that a shadow root cannot cover:
     the color scheme the document resolves Canvas against, and a background
     that reaches the corners of the viewport. */
  html { color-scheme: light dark; }
  body { margin: 0; background: Canvas; color: CanvasText; }
</style>

<div id="app"></div>

<script type="module">
import { mount } from '/__bitbang__/settings-panel.js';

/* Standalone: both defaults, so nothing to pass. The title is wanted here --
   nothing else on this page says what it is -- and the actions are on
   everywhere. */
mount(document.getElementById('app'));
</script>
