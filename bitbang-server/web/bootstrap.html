<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Static fallback title. The device flow overwrites this almost
         immediately (_print() puts connection status in the tab, then
         the proxied app's own title takes over), and the entry page sets
         its own in bootstrap.js. This value is what a link-preview
         scraper sees and what shows before any JS runs, so it must be
         the product name rather than a status word. -->
    <title>BitBang</title>
    <meta name="description" content="Connect to any device from your browser. No account, no port forwarding, no client to install — end-to-end encrypted peer-to-peer links.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="BitBang">
    <meta property="og:title" content="BitBang">
    <meta property="og:description" content="Connect to any device from your browser. No account, no port forwarding, no client to install — end-to-end encrypted peer-to-peer links.">
    <meta property="og:url" content="https://bitba.ng/">
    <meta name="twitter:card" content="summary">
    <!-- Explicit favicon link bypasses the browser's default
         autodiscovery of /favicon.ico, which the SW intercepts and
         tries to proxy through the device (where it 404s). The
         /__bitbang__/* prefix is on isServerEndpoint's skip list, so
         the request goes straight to bitbang-server's static.go,
         which maps favicon.ico → favicon.png. -->
    <link rel="icon" type="image/png" href="/__bitbang__/favicon.ico">
    <script>
        // !debug (fragment flag, see CONVENTIONS.md) loads eruda -- a floating
        // console/network/storage panel for mobile, where browser DevTools
        // aren't available. Loaded async so it doesn't block the connection
        // sequence. Parsed inline here because this runs before bootstrap.js
        // — grammar: `#<code>!debug[,other-flags][/device-url]`.
        (function () {
            const frag = location.hash ? location.hash.slice(1) : '';
            let i = 0;
            while (i < frag.length && /[A-Za-z0-9_-]/.test(frag[i])) i++;
            if (frag[i] !== '!') return;
            let j = i + 1;
            while (j < frag.length && frag[j] !== '/') j++;
            const flags = frag.slice(i + 1, j).split(',');
            if (!flags.includes('debug')) return;
            const s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/eruda';
            s.onload = () => {
                if (!window.eruda) return;
                eruda.init();
                eruda.position({ x: window.innerWidth - 60, y: window.innerHeight - 60 });
            };
            document.head.appendChild(s);
        })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #fff;
            color: #333;
            min-height: 100vh;
        }

        #connection-ui {
            padding: 12px 16px;
            font-family: "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
            font-size: 13px;
            color: #333;
            line-height: 1.6;
        }

        .error {
            color: #c00;
        }

    </style>
</head>
<body>
    <!-- Front page snippet. On `/`, bitbang-server splices FRONT_PAGE_PATH's
         contents in at the marker below; the snippet may include a
         `<div id="bb-pair-input"></div>` where bootstrap.js will render the
         pair-code form. Empty splice (or no env var) leaves this div empty,
         and showPairingInput falls back to rendering inside #connection-ui.
         For non-`/` routes the splice never happens (server-side), so this
         div stays empty regardless. -->
    <div id="bb-front-page"><!-- FRONT_PAGE --></div>
    <div id="connection-ui">
        <div id="status">Loading...</div>
    </div>
    <script src="/__bitbang__/flow-control.js"></script>
    <script src="/__bitbang__/bootstrap.js"></script>
</body>
</html>
