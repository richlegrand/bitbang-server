<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Loading...</title>
    <!-- Explicit favicon link bypasses the browser's default
         autodiscovery of /favicon.ico, which the SW intercepts and
         tries to proxy through the device (where it 404s). The
         /__bitbang__/* prefix is on isServerEndpoint's skip list, so
         the request goes straight to bitbang-server's static.go,
         which maps favicon.ico → favicon.png. -->
    <link rel="icon" type="image/png" href="/__bitbang__/favicon.ico">
    <script>
        // ?debug loads eruda -- a floating console/network/storage panel for
        // mobile, where browser DevTools aren't available. Loaded async so it
        // doesn't block the connection sequence.
        if (new URLSearchParams(location.search).has('debug')) {
            const s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/eruda';
            s.onload = () => {
                if (!window.eruda) return;
                eruda.init();
                eruda.position({ x: window.innerWidth - 60, y: window.innerHeight - 60 });
            };
            document.head.appendChild(s);
        }
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #fff;
            color: #333;
            min-height: 100vh;
        }

        #connection-ui {
            padding: 12px 16px;
            font-family: "SF Mono", "Menlo", "Monaco", "Consolas", monospace;
            font-size: 13px;
            color: #333;
            line-height: 1.6;
        }

        .error {
            color: #c00;
        }

    </style>
</head>
<body>
    <div id="connection-ui">
        <div id="status">Loading...</div>
    </div>
    <script src="/__bitbang__/bootstrap.js"></script>
</body>
</html>
