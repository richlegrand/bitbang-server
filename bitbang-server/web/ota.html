<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firmware</title>
<!--
  Temporary: this page belongs in a plugin and lives here only until the server
  has one, so expect it to move out of web/ wholesale rather than evolve here.

  The device firmware meta-page.

  GET /__bitbang/ota says what is running and where an update would go; POST
  streams an image into the slot the device is not running from. The device
  supplies data and no HTML at all, so a fix here reaches every device without
  updating any of them -- which is the point of a meta-page, and doubly so for
  the page whose job is updating.

  Standalone, for iteration without a device:
      python3 -m http.server   then open  ota.html?src=ota-mock.json
-->
<style>
  :root {
    color-scheme: light dark;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --accent: #3b82f6;
    --dim: #8a8a8e;
    --line: #8884;
    --bad: #e5484d;
    --ok: #30a46c;
    --warn: #f5a623;
    accent-color: var(--accent);
  }
  body { font:15px/1.6 var(--font); margin:0; padding:2rem 1.5rem; max-width:42rem; }
  h1 { font-size:.8rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
       color:var(--dim); margin:0 0 1.25rem; }
  h2 { font-size:.8rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
       color:var(--dim); margin:2rem 0 .75rem; }

  .row { display:grid; grid-template-columns:9rem 1fr; gap:.35rem 1.25rem;
         align-items:baseline; padding:.3rem 0; }
  @media (max-width:34rem) { .row { grid-template-columns:1fr; } }
  .label { color:var(--dim); }
  .val { font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
  .val.mono { font-family:var(--mono); font-size:.85rem; }

  /* The probation state is the one thing on this page worth a color: it is the
     difference between an update that stuck and one the bootloader is going to
     undo at the next reset. */
  .pill { display:inline-block; font-size:.78rem; padding:.05rem .45rem;
          border:1px solid var(--line); border-radius:999px; }
  .pill.ok   { color:var(--ok);   border-color:var(--ok); }
  .pill.warn { color:var(--warn); border-color:var(--warn); }
  .pill.bad  { color:var(--bad);  border-color:var(--bad); }

  #drop { border:1px dashed var(--line); border-radius:8px; padding:1.5rem 1rem;
          text-align:center; color:var(--dim); cursor:pointer; }
  #drop:hover, #drop.over { border-color:var(--accent); color:inherit; }
  #drop.over { background:color-mix(in srgb, var(--accent) 8%, transparent); }
  #file { display:none; }

  button.action { font:inherit; color:inherit; background:none; cursor:pointer;
    border:1px solid var(--line); border-radius:5px; padding:.35rem .9rem; }
  button.action:hover:not(:disabled) { border-color:var(--accent); }
  button.action:disabled { opacity:.5; cursor:default; }
  button.go { border-color:var(--accent); color:var(--accent); }

  #bar { height:4px; border-radius:2px; background:var(--line); overflow:hidden;
         margin:.75rem 0 .35rem; }
  #bar > div { height:100%; width:0; background:var(--accent); transition:width .2s linear; }

  .state { font-size:.85rem; color:var(--dim); min-height:1.2em; }
  .state.err  { color:var(--bad); }
  .state.ok   { color:var(--ok); }
  .state.warn { color:var(--warn); }
  .hide { display:none; }
</style>

<h1>Firmware</h1>

<div id="now"></div>

<h2 id="update-head">Update</h2>
<div id="drop">Drop a .bin here, or click to choose</div>
<input type="file" id="file" accept=".bin,application/octet-stream">
<div id="incoming"></div>
<div id="bar" class="hide"><div></div></div>
<div id="state" class="state"></div>

<script>
const SRC = new URLSearchParams(location.search).get('src') || '/__bitbang/ota';

const $ = id => document.getElementById(id);
const text = (el, s) => { el.textContent = s; };

function say(msg, kind) {
    const el = $('state');
    el.className = 'state' + (kind ? ' ' + kind : '');
    el.textContent = msg;
}

function bytes(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
    return (n / 1024 / 1024).toFixed(2) + ' MB';
}

function rows(pairs) {
    return pairs.filter(p => p[1] !== undefined && p[1] !== '').map(p =>
        `<div class="row"><div class="label">${p[0]}</div>` +
        `<div class="val${p[2] ? ' ' + p[2] : ''}">${p[1]}</div></div>`).join('');
}

const esc = s => String(s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* -- what is running ------------------------------------------------- */

/* Only "valid" means the update is finished. An image sitting in
   pending-verify boots on probation and the bootloader puts the old one back
   at the next reset, so saying "updated" here would be wrong in the one case
   where it matters most. */
function statePill(state) {
    if (!state) return '';
    if (state === 'valid') {
        return '<span class="pill ok">confirmed</span>';
    }
    if (state === 'pending-verify') {
        return '<span class="pill warn">on probation</span>'
             + ' <span class="label">confirmed once the device registers</span>';
    }
    if (state === 'undefined' || state === 'new') {
        /* What a USB flash looks like: nothing was ever on probation. */
        return '<span class="pill">not from an update</span>';
    }
    return `<span class="pill bad">${esc(state)}</span>`;
}

let status = null;

async function loadStatus() {
    const r = await fetch(SRC, { cache: 'no-store' });
    if (!r.ok) {
        /* An HTTP status, however unwelcome, means the device answered. That
           is a different thing from not reaching it at all, and after an
           update the difference is the whole diagnosis: a 404 here says the
           image that just booted has no update endpoint. */
        const e = new Error(`device answered ${r.status}`);
        e.status = r.status;
        throw e;
    }
    status = await r.json();

    const when = [status.date, status.time].filter(Boolean).join(' ');
    $('now').innerHTML = rows([
        ['Version', esc(status.version || 'unknown')],
        ['Project', esc(status.project || '')],
        ['Built', esc(when)],
        ['ESP-IDF', esc(status.idf || '')],
        ['Slot', esc(status.running || '?') + ' ' + statePill(status.state)],
        ['ELF SHA256', esc((status.sha256 || '').slice(0, 32)), 'mono'],
    ]);

    /* No second slot is not a failure to report as one: it is a build that
       cannot update itself, and no amount of retrying changes that. */
    if (!status.target) {
        $('update-head').classList.add('hide');
        $('drop').classList.add('hide');
        say('This build has a single app slot, so it cannot be updated over '
          + 'BitBang. It needs a partition table with two app slots, flashed '
          + 'over USB once.', 'warn');
        return;
    }
    say('');
}

/* -- reading the image the user picked -------------------------------- */

const IMAGE_MAGIC = 0xe9;      /* first byte of an esp image */
const DESC_OFFSET = 0x20;      /* esp_app_desc_t follows the image and segment headers */
const DESC_MAGIC = 0xabcd5432;

/* Read the version out of the file before uploading it. Fifty seconds is a
   long time to spend finding out you picked the wrong .bin, and the file name
   does not say which project it was built from. */
async function describe(file) {
    const head = new Uint8Array(await file.slice(0, 256).arrayBuffer());
    if (head.length < DESC_OFFSET + 176 || head[0] !== IMAGE_MAGIC) {
        return { bad: 'that does not look like an ESP firmware image' };
    }
    const dv = new DataView(head.buffer);
    if (dv.getUint32(DESC_OFFSET, true) !== DESC_MAGIC) {
        return { bad: 'no application descriptor in that image' };
    }
    const str = (off, len) => {
        const raw = head.slice(DESC_OFFSET + off, DESC_OFFSET + off + len);
        const end = raw.indexOf(0);
        return new TextDecoder().decode(end < 0 ? raw : raw.slice(0, end));
    };
    return {
        version: str(16, 32),
        project: str(48, 32),
        time: str(80, 16),
        date: str(96, 16),
        idf: str(112, 32),
    };
}

async function choose(file) {
    $('bar').classList.add('hide');
    const d = await describe(file);

    if (d.bad) {
        $('incoming').innerHTML = '';
        say(d.bad, 'err');
        return;
    }

    const tooBig = status && status.target_size && file.size > status.target_size;
    /* A different project on the same hardware is how a device gets an image
       that boots into something unrecognizable. Rollback would save it, but
       only after a reset nobody is there to give it. */
    const wrongProject = status && status.project && d.project
                         && status.project !== d.project;

    $('incoming').innerHTML = rows([
        ['File', esc(file.name)],
        ['Size', bytes(file.size) + (status && status.target_size
            ? ` <span class="label">of ${bytes(status.target_size)} in ${esc(status.target)}</span>` : '')],
        ['Version', esc(d.version)],
        ['Project', esc(d.project)],
        ['Built', esc([d.date, d.time].filter(Boolean).join(' '))],
    ]) + '<div style="margin-top:1rem"><button class="action go" id="go">'
       + (wrongProject ? 'Install anyway' : 'Install') + '</button></div>';

    $('go').onclick = () => install(file);

    if (tooBig) {
        $('go').disabled = true;
        say(`That image is larger than the ${esc(status.target)} slot. It cannot be written.`, 'err');
        return;
    }
    if (wrongProject) {
        say(`This device is running "${esc(status.project)}" and that image is `
          + `"${esc(d.project)}". Check it is meant for this device.`, 'warn');
        return;
    }
    if (status && d.version && d.version === status.version) {
        say('That is the version already running. Installing it again is harmless, '
          + 'just slow.', 'warn');
    } else {
        say('');
    }
}

/* -- the upload ------------------------------------------------------- */

/* XMLHttpRequest rather than fetch, so the request carries a Content-Length:
   bootstrap reports progress against it, and a streamed fetch body has none. */
function install(file) {
    const go = $('go');
    if (go) go.disabled = true;
    $('drop').classList.add('hide');
    $('bar').classList.remove('hide');

    const fill = $('bar').firstElementChild;
    const started = performance.now();

    /* Progress comes from bootstrap over a BroadcastChannel, not from
       xhr.upload. The service worker intercepts the request before it reaches
       the network, so the browser's own upload events never fire -- they
       measure a transfer that does not happen. bootstrap is where the bytes
       really go out, and the only layer that waits on data channel
       backpressure, so it is the only honest source of a percentage.

       xhr.upload is still wired up underneath for the standalone case, where
       there is no service worker and no bootstrap; whichever speaks first
       wins and the other is ignored. */
    let sawBootstrap = false;

    const show = (loaded, total) => {
        if (!total) {
            say(`Sent ${bytes(loaded)}...`);
            return;
        }
        fill.style.width = (loaded / total * 100).toFixed(1) + '%';
        const secs = (performance.now() - started) / 1000;
        const rate = secs > 0 ? loaded / secs : 0;
        const left = rate > 0 ? (total - loaded) / rate : 0;
        say(`${bytes(loaded)} of ${bytes(total)} at ${bytes(rate)}/s`
          + (left > 1 ? `, about ${Math.ceil(left)}s left` : ''));
    };

    let progress = null;
    try {
        progress = new BroadcastChannel('bitbang-progress');
    } catch (_) { /* no BroadcastChannel: fall back to xhr.upload */ }

    const doneWithProgress = () => {
        if (progress) { progress.close(); progress = null; }
    };

    if (progress) {
        progress.onmessage = e => {
            const m = e.data || {};
            if (m.type === 'uploadProgress') {
                sawBootstrap = true;
                show(m.loaded, m.total || file.size);
            } else if (m.type === 'uploadComplete') {
                sawBootstrap = true;
                fill.style.width = '100%';
                /* The bytes are out, but the device is still writing the last
                   of them to flash and has not replied yet. */
                say('Sent. Waiting for the device to finish writing...');
            }
        };
    }

    const xhr = new XMLHttpRequest();
    xhr.open('POST', SRC);

    xhr.upload.onprogress = e => {
        if (sawBootstrap) return;
        show(e.loaded, e.lengthComputable ? e.total : 0);
    };

    xhr.onload = () => {
        doneWithProgress();
        let reply = {};
        try { reply = JSON.parse(xhr.responseText); } catch (_) { /* not json */ }
        if (xhr.status === 200 && reply.ok) {
            fill.style.width = '100%';
            say(`${bytes(reply.bytes || file.size)} written to ${esc(reply.partition || '')}. `
              + 'The device is restarting.', 'ok');
            waitForReturn();
            return;
        }
        fill.style.width = '0';
        say('The device refused the image: '
          + esc(reply.error || xhr.responseText || `status ${xhr.status}`), 'err');
        offerRetry();
    };

    /* The device restarts 1.5 s after replying, so a transport error here is
       genuinely a failed upload and not the reboot. */
    xhr.onerror = () => {
        doneWithProgress();
        fill.style.width = '0';
        say('The upload did not reach the device. Nothing was written.', 'err');
        offerRetry();
    };

    say('Starting...');
    xhr.send(file);
}

function offerRetry() {
    $('drop').classList.remove('hide');
    const go = $('go');
    if (go) go.disabled = false;
}

/* -- waiting for it to come back -------------------------------------- */

/* The session dies with the reboot, so every request fails until the device
   has registered again and the browser has a new one. Keep asking, and say
   plainly when it is taking longer than it should rather than spinning
   forever with no explanation. */
async function waitForReturn() {
    const started = performance.now();
    const deadline = started + 180000;
    const before = status;
    $('incoming').innerHTML = '';
    $('bar').classList.add('hide');

    /* Reaching the device at all means it registered: every request travels
       through signaling. So a reply still saying pending-verify is not an
       image waiting to be accepted, it is an image that does not accept
       itself. One reading could be the instant between registering and
       marking; two in a row cannot. */
    let stillOnProbation = 0;

    while (performance.now() < deadline) {
        await new Promise(r => setTimeout(r, 3000));
        try {
            await loadStatus();
        } catch (e) {
            if (e.status) {
                /* It booted and it is reachable, so the update "worked" -- but
                   this image cannot receive the next one. Say what to do while
                   it is still worth doing: an image that has not accepted
                   itself is one power cycle away from being undone, and an
                   image that has is a trip with a USB cable. */
                say(`The device is back, but this image has no update endpoint `
                  + `(${e.status}). If it has not accepted itself, power cycling `
                  + `now puts the previous image back. If it has, the next `
                  + `update has to go over USB.`, 'err');
                return;
            }
            const secs = Math.round((performance.now() - started) / 1000);
            say(`Waiting for the device to come back (${secs}s)...`);
            continue;
        }

        if (status.state === 'pending-verify') {
            if (++stillOnProbation < 2) {
                say(`Running ${esc(status.version || '')} from ${esc(status.running)}, `
                  + 'waiting for it to accept itself.', 'warn');
                continue;
            }
            say(`Running ${esc(status.version || '')} from ${esc(status.running)}, `
              + 'but it has not accepted itself. It is reachable, so it has '
              + 'already registered and is not going to: the bootloader will '
              + 'put the previous image back at the next reset.', 'err');
            $('drop').classList.remove('hide');
            return;
        }
        stillOnProbation = 0;

        if (status.state === 'valid') {
            if (before && status.running === before.running
                && status.version === before.version) {
                /* Same slot and same version: the bootloader put the old image
                   back, which is what it does when an update boots but cannot
                   reach the network. */
                say('The device came back on the image it started with. The '
                  + 'update was rolled back.', 'err');
            } else {
                say(`Updated. Running ${esc(status.version || '')} from `
                  + `${esc(status.running)}.`, 'ok');
            }
            $('drop').classList.remove('hide');
            return;
        }
    }
    say('The device has not come back. Reload this page once it is online.', 'err');
}

/* -- picking a file --------------------------------------------------- */

const drop = $('drop');
drop.onclick = () => $('file').click();
$('file').onchange = e => { if (e.target.files[0]) choose(e.target.files[0]); };

drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => {
    e.preventDefault();
    drop.classList.remove('over');
    if (e.dataTransfer.files[0]) choose(e.dataTransfer.files[0]);
};

loadStatus().catch(e => {
    if (e.status === 404) {
        /* Reached it, and it has no /__bitbang/ota. Firmware too old for
           updates over BitBang rather than anything wrong here. */
        $('update-head').classList.add('hide');
        $('drop').classList.add('hide');
        say('This device is running firmware without an update endpoint, so it '
          + 'cannot be updated from here. It needs one flash over USB with a '
          + 'build that has one.', 'err');
        return;
    }
    say(e.status ? `The device answered ${e.status}.`
                 : 'Could not reach the device: ' + e.message, 'err');
});
</script>
