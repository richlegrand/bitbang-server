<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Console</title>
<!--
  Temporary: this page belongs in a plugin and lives here only until the server
  has one, so expect it to move out of web/ wholesale rather than evolve here.

  The device console meta-page, which is now a wrapper, as settings.html is.
  Everything that draws anything lives in console-panel.js and mounts into a
  shadow root, so the same implementation serves this page and a console
  embedded in a sketch's own layout through data-bitbang-page="console".
-->
<style>
  /* The page's own frame: the whole viewport, with the panel filling it so the
     log is what scrolls. Everything inside the panel is the component's. */
  html { color-scheme: light dark; height: 100%; }
  body { margin: 0; height: 100%; display: flex; flex-direction: column;
         background: Canvas; color: CanvasText; }
  #app { flex: 1; min-height: 0; }
</style>

<div id="app"></div>

<script type="module">
import { mount } from '/__bitbang__/console-panel.js';

/* Standalone: the title is wanted here -- nothing else on this page says what
   it is. */
mount(document.getElementById('app'));
</script>
